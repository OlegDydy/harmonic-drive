<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Волновой редуктор</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      label {
        font-weight: bold;
      }
      .control-panel {
        display: grid;
        position: fixed;
        left: 10px;
        top: 10px;
        border-radius: 8px;
        padding: 16px 10px;
        grid-template-columns: auto 1fr auto;
        box-shadow: 1px 2px 6px #0008;
        gap: 4px;
        background: #fff;
      }
      .control-panel h1 {
        font-size: 1.2rem;
        margin-top: 0;
      }
      .control-panel > .second {
        grid-column: 2 / 3;
      }
      .control-panel > hr {
        grid-column: 1 / 4;
        width: 100%;
        border: none;
        border-top: 1px solid grey;
      }
      .control-panel > .prop-group_header {
        margin: 0;
        font: inherit;
        font-weight: bold;
        grid-column: 1 / 4;
      }
      .sub-grid {
        display: grid;
        grid-column: 1 / 4;
        grid-row: span 1;
        grid-template-columns: subgrid;
      }
      .toggle-property:not(:checked) ~ input,
      .toggle-property:checked ~ output {
        display: none;
        visibility: hidden;
      }
      .toggle-property:not(:checked) ~ output,
      .toggle-property:checked ~ input {
        display: initial;
        visibility: visible;
      }
      .drawing {
        height: 100vh;
        background: 50% 50%
          url('data:image/svg+xml,<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg width="16" height="16" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M0 0H16V16H0Z" fill="ghostwhite"/><path d="M8.5 16V0M0 8.5H16" fill="none" stroke="lightgray"/></svg>');
      }
      .drawing > svg {
        width: 100%;
        height: 100%;
      }
      .error {
        display: none;
        visibility: hidden;
        padding: 4px 8px;
        border-radius: 4px;
        background-color: #ff4f4f;
        color: #fff;
        text-align: center;
      }
      .error:not(:empty) {
        display: block;
        visibility: visible;
      }
    </style>
    <script src="index.js"></script>
  </head>
  <body>
    <div class="control-panel">
      <div class="prop-group_header">
        <h1>Генератор волнового редуктора с промежуточными <br />телами качения</h1>
      </div>
      <label class="second">Передаточное отношение:</label>
      <span
        ><output id="out_gearRatioNum">8</output> : <output id="out_gearRatioDenom">1</output> =
        <output id="out_gearRatio">8</output>
      </span>
      <label class="second">Волн жёсткого колеса:</label>
      <output id="out_zHard">9</output>

      <input id="in_animation" name="animation" type="checkbox" title="Включить анимацию" />
      <label for="in_rpm">Об/мин:</label>
      <input  id="in_rpm" name="rpm" type="number" min="0" value="60" />

      <label class="second" for="in_zBalls">Тел качения:</label>
      <input id="in_zBalls" name="zBalls" type="number" min="1" value="8" />

      <label class="second" for="in_zWaves">Волн волнообразователя:</label>
      <input id="in_zWaves" name="zWaves" type="number" min="1" value="1" />

      <label class="second" for="in_thickness">Толщина жесткого колеса:</label>
      <input id="in_thickness" name="thickness" type="number" step="0.01" min="0" value="1" />

      <label class="second" for="in_sepOffset">Отступ сепаратора:</label>
      <input id="in_sepOffset" name="sepOffset" type="number" min="0" step="0.01" value="0.15" />

      <label class="second" for="in_rOuter">Внешний радиус профиля:</label>
      <input id="in_rOuter" name="rOuter" type="number" min="0" step="0.01" value="11" />
      <hr />
      <h2 class="prop-group_header">Базовая характеристика</h2>
      <div class="sub-grid">
        <input type="radio" name="baseProperty" class="toggle-property" value="rIn" />
        <label for="base_r-inner">Внутренний радиус профиля:</label>
        <input id="in_rInner" name="rInner" type="number" max="10" step="0.01" value="9.8" />
        <output id="out_rInner">9.8</output>
      </div>
      <div class="sub-grid">
        <input type="radio" name="baseProperty" class="toggle-property" value="e" />
        <label for="in_e">Эксцентриситет:</label>
        <input id="in_e" name="e" type="number" step="0.01" value="0.6" />
        <output id="out_e">0.6</output>
      </div>
      <div class="sub-grid">
        <input type="radio" name="baseProperty" class="toggle-property" value="rBall" checked />
        <label for="in_rBall">Радиус тел качения:</label>
        <input id="in_rBall" name="rBall" type="number" step="0.01" value="1.5" />
        <output id="out_rBall">1.5</output>
      </div>
      <div class="sub-grid">
        <input type="radio" name="baseProperty" class="toggle-property" value="hSep" />
        <label for="in_hSep">Толщина сепаратора:</label>
        <input id="in_hSep" name="hSep" type="number" step="0.01" value="1.32" />
        <output id="out_hSep">1.32</output>
      </div>
      <div id="out_error" class="error" style="grid-column: 1 / 4"></div>
      <hr />
      <div class="prop-group_header">
        <label>
          Тип профиля:
          <select id="in_outputStyle" name="outputStyle">
            <option value="bezier" selected>Кривая</option>
            <option value="polyline">Ломаная</option>
          </select>
        </label>
        <br />
        <button id="save" type="button">Сохранить</button>
      </div>
    </div>
    <div class="drawing">
      <svg id="drawing" version="1.1" xmlns="http://www.w3.org/2000/svg" fill="none">
        <g id="layer_hard-wheel" stroke="#00f">
          <path id="center" d="M-5,0 0 0V-5M5 0 0 0V5" />
          <path id="hard-wheel" d="" />
        </g>
        <g id="layer_separator" stroke="#f00"><path id="separator" d="" /></g>
        <g id="layer_wave-gen" stroke="#f0f"><path id="wave-gen" d="" /></g>
        <g id="layer_balls" stroke="#008"></g>
      </svg>
    </div>
  </body>
</html>
